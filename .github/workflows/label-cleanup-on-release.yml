# When a release label lands on an issue, strip the workflow-state labels
# that no longer apply (checking, planned, question, done-unreleased, ...).
# A final release (status:released) also supersedes the channel variants
# (released-dev/rc/alpha). Fires only on the labeling event itself, so
# status labels re-added manually afterwards survive.
name: Label cleanup on release

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  strip-stale-status-labels:
    name: Strip stale status labels
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded labels
        uses: actions/github-script@v9
        with:
          script: |
            const RELEASED = new Set([
              'status:released',
              'status:released-dev',
              'status:released-rc',
              'status:released-alpha',
            ]);
            const STALE = new Set([
              'status:checking',
              'status:help-required',
              'status:in-progress',
              'status:planned',
              'status:question',
              'status:invalid',
              'status:not-planned',
              'status:wontfix',
              'status:done-unreleased',
            ]);

            const added = context.payload.label.name;
            if (!RELEASED.has(added)) {
              return;
            }

            const current = context.payload.issue.labels.map((l) => l.name);
            // A final release supersedes the channel release variants.
            const superseded =
              added === 'status:released'
                ? (name) => RELEASED.has(name) && name !== added
                : () => false;
            const toRemove = current.filter(
              (name) =>
                name !== added && (STALE.has(name) || superseded(name))
            );
            for (const name of toRemove) {
              core.info(`Removing '${name}' — issue is ${added}`);
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name,
              });
            }
