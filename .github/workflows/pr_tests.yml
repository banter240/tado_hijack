name: PR Tests

on:
  pull_request:
    branches: ['dev', 'main']
    paths:
      - 'custom_components/tado_hijack/**'
      - 'scripts/validate_translations.py'
      - '.github/workflows/pr_tests.yml'

jobs:
  # Job 1: Call the reusable linting workflow.
  lint:
    name: "Run Linter"
    uses: ./.github/workflows/lint.yml

  # Job 2: Call the reusable HACS and hassfest validation workflow.
  validation:
    name: "Run Validation"
    uses: ./.github/workflows/validate.yml

  # Job 3: Ensure action and selector translations match services.yaml.
  translation-validation:
    name: "Validate Translations"
    uses: ./.github/workflows/translations.yml
