# Shared Field Definitions (DRY)
manual_poll:
  fields:
    refresh_type:
      default: "all"
      selector:
        select:
          translation_key: refresh_type
          options:
            - "all"
            - "zone"
            - "metadata"
            - "offsets"
            - "away"
            - "capabilities"
            - "presence"
    entity_id:
      selector:
        entity:
          integration: tado_hijack
    config_entry:
      selector:
        config_entry:
          integration: tado_hijack

resume_all_schedules:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: tado_hijack

turn_off_all_zones:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: tado_hijack

boost_all_zones:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: tado_hijack

set_mode:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: tado_hijack
    hvac_mode:
      required: true
      default: "heat"
      selector:
        select:
          translation_key: hvac_mode
          options:
            - "off"
            - "heat"
            - "auto"
    duration: &field_duration
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "min"
    overlay: &field_overlay
      required: true
      default: "manual"
      selector:
        select:
          translation_key: overlay_mode
          options:
            - "manual"
            - "next_block"
            - "presence"
    temperature:
      default: 21.0
      selector:
        number:
          min: 5
          max: 30
          step: 0.1
          unit_of_measurement: "°C"
    refresh_after: &field_refresh_after
      required: true
      default: false
      selector:
        boolean: {}

set_mode_all_zones:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: tado_hijack
    include_heating:
      required: true
      default: true
      selector:
        boolean: {}
    include_ac:
      required: true
      default: false
      selector:
        boolean: {}
    hvac_mode:
      required: true
      default: "heat"
      selector:
        select:
          translation_key: hvac_mode
          options:
            - "off"
            - "heat"
            - "auto"
    duration: *field_duration
    overlay: *field_overlay
    temperature:
      default: 21.0
      selector:
        number:
          min: 5
          max: 30
          step: 0.1
          unit_of_measurement: "°C"
    refresh_after: *field_refresh_after

set_water_heater_mode:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: water_heater
          integration: tado_hijack
    operation_mode:
      required: true
      default: "heat"
      selector:
        select:
          translation_key: water_heater_operation_mode
          options:
            - "off"
            - "heat"
            - "auto"
    duration: *field_duration
    overlay: *field_overlay
    temperature:
      default: 50
      selector:
        number:
          min: 30
          max: 65
          step: 1
          unit_of_measurement: "°C"
    refresh_after: *field_refresh_after

add_meter_reading:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tado_hijack
    reading:
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          mode: box
    date:
      required: false
      selector:
        date:
