repos:
  # Standard hooks for file integrity and basic checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys, --indent=2, --no-ensure-ascii]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # yamllint for YAML file validation.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Ruff hook for fast linting and formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy hook for static type checking.
  # Uses Python 3.14 (tadoasync requires >=3.12) with tadoasync==0.2.3 pinned,
  # as the patching layer requires exactly this version.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        language_version: python3.14
        types: [python]
        args: [--ignore-missing-imports, --explicit-package-bases]
        additional_dependencies:
          - "mypy==2.3.1"
          - "tadoasync==0.2.3"
          - "pydantic==2.13.5"
          - "homeassistant==2026.11.1"

  # Sourcery hook for AI-powered refactoring.
  - repo: https://github.com/sourcery-ai/sourcery
    rev: "v1.45.0"
    hooks:
      - id: sourcery
        # Automatically apply fixes suggested by Sourcery
        args: ["--fix"]

  # Gitleaks hook for detecting secrets and sensitive information.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # Use the latest stable version
    hooks:
      - id: gitleaks

  # Validate the commit message against the semantic-release parsing rules.
  - repo: local
    hooks:
      - id: commit-message
        name: commit message validation
        entry: "../.venv/bin/python3 scripts/check_commit_message.py"
        language: system
        stages: [commit-msg]
        always_run: true
        description: "Reject headers/types semantic-release would mis-parse."

  # Hard gate before a push leaves the machine: ruff, mypy, tests.
  # Skip explicitly with --no-verify only.
  - repo: local
    hooks:
      - id: push-gate
        name: pre-push gate (ruff + mypy + tests)
        entry: "bash -c '../.venv/bin/python -m ruff check . && ../.venv/bin/python -m mypy . && ../.venv/bin/python -m pytest tests/ -q'"
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        description: "Refuse the push when lint, types or tests fail."

  # Local hooks for Home Assistant & HACS validation (Parity with GitHub Actions)
  - repo: local
    hooks:
      - id: hassfest
        name: local hassfest validation
        entry: "../.venv/bin/python3 -m homeassistant.helpers.check_config --config ."
        language: system
        pass_filenames: false
        always_run: true
        description: "Run Home Assistant's internal config validation (Parity with CI Hassfest)."

      - id: hacs-validation
        name: local HACS validation
        entry: "./scripts/local_hacs_validate.py"
        language: system
        pass_filenames: false
        always_run: true
        description: "Run basic HACS compliance checks (Parity with CI HACS Validation)."
